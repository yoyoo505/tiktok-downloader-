<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Downloader Pro</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3046/3046122.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    :root {
      --primary: #ff0050;
      --secondary: #23272f;
      --card-bg: #22262e;
      --input-bg: #2c313a;
      --border-radius: 14px;
      --green: #28a745;
      --blue: #007bff;
      --purple: #6f42c1;
      --dl-shadow: 0 4px 18px #28a74540;
    }
    body {
      background: var(--secondary);
      color: #f2f2f2;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container {
      max-width: 420px;
      margin: 40px auto 0 auto;
      background: var(--card-bg);
      padding: 24px 18px 20px 18px;
      border-radius: var(--border-radius);
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      position: relative;
      z-index: 5;
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }
    .logo-img {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      margin-right: 10px;
      background: #fff;
      box-shadow: 0 0 4px #ff005088;
    }
    h2 {
      font-size: 1.55em;
      font-weight: 700;
      text-align: center;
      margin: 8px 0 15px 0;
      letter-spacing: 1px;
    }
    input[type="text"] {
      background: var(--input-bg);
      color: #fff;
      border: 1px solid #333a;
      padding: 12px;
      border-radius: var(--border-radius);
      font-size: 1em;
      margin-bottom: 8px;
      width: 100%;
      box-sizing: border-box;
      outline: none;
      transition: border 0.2s;
    }
    input[type="text"]:focus {
      border: 1.7px solid var(--primary);
    }
    button {
      border: none;
      border-radius: var(--border-radius);
      padding: 12px;
      width: 100%;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 7px;
      box-shadow: 0 2px 8px #ff005030;
      transition: background 0.18s, box-shadow 0.18s, transform 0.12s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }
    button:active {
      transform: scale(0.98);
    }
    button.download-btn {
      background: var(--green);
      color: #fff;
      box-shadow: var(--dl-shadow);
      position: relative;
      overflow: hidden;
    }
    button.download-btn:hover {
      background: #218838;
      animation: bounce 0.33s;
    }
    @keyframes bounce {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.06); }
      70%  { transform: scale(0.97); }
      100% { transform: scale(1); }
    }
    button.download-hd {
      background: var(--blue);
      box-shadow: 0 4px 18px #007bff40;
    }
    button.download-hd:hover {
      background: #0056b3;
    }
    button.download-mp3 {
      background: var(--purple);
      box-shadow: 0 4px 18px #6f42c140;
    }
    button.download-mp3:hover {
      background: #5a348b;
    }
    .clear-btn {
      background: #2d323c;
      color: #fff;
      margin-bottom: 16px;
      border: 1px solid #444a;
      display: none;
      animation: fadein 0.7s;
    }
    .clear-btn:hover {
      background: #383d47;
    }
    .loading, .error {
      text-align: center;
      font-size: 1.05em;
      margin: 8px 0;
      display: none;
      animation: fadein 0.7s;
    }
    .loading { color: #ffa; }
    .error { color: #f88; }
    @keyframes fadein {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    .preview {
      margin-top: 16px;
      text-align: center;
      animation: fadein 0.7s;
    }
    .preview img.cover {
      width: 170px;
      border-radius: 13px;
      box-shadow: 0 2px 15px #0002;
      margin-bottom: 7px;
      background: #fff;
    }
    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid #fff6;
      margin-bottom: 5px;
      box-shadow: 0 0 8px #0002;
    }
    .info-table {
      margin: 14px auto 0 auto;
      text-align: left;
      width: 100%;
      max-width: 340px;
      border-collapse: collapse;
      font-size: 0.98em;
      background: #262a34;
      border-radius: 7px;
      overflow: hidden;
    }
    .info-table td {
      padding: 7px 9px;
      border-bottom: 1px solid #222;
    }
    .info-table td.label {
      color: #aaa;
      width: 115px;
      font-weight: 400;
      letter-spacing: 0.1px;
    }
    .info-table td.value {
      font-weight: 600;
      color: #fff;
    }
    .download-links {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    /* Gallery */
    .gallery-section {
      margin: 18px 0 0 0;
    }
    .gallery-title {
      text-align: left;
      font-weight: 600;
      color: #fff;
      margin-bottom: 9px;
      font-size: 1.05em;
      letter-spacing: 0.2px;
    }
    .gallery-scroll {
      display: flex;
      overflow-x: auto;
      gap: 14px;
      padding-bottom: 8px;
      scroll-snap-type: x mandatory;
      scrollbar-width: thin;
      scrollbar-color: #ff0050 #222;
    }
    .gallery-item {
      background: #23272f;
      border-radius: 13px;
      box-shadow: 0 2px 12px #0002;
      min-width: 140px;
      max-width: 180px;
      flex: 0 0 auto;
      scroll-snap-align: start;
      padding: 10px 8px 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      transition: box-shadow 0.18s;
    }
    .gallery-item:hover {
      box-shadow: 0 2px 24px #ff005050;
    }
    .gallery-img {
      width: 100%;
      max-width: 155px;
      border-radius: 8px;
      object-fit: cover;
      margin-bottom: 8px;
      background: #fff;
      box-shadow: 0 2px 8px #0002;
    }
    .gallery-download {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      font-weight: 600;
      padding: 8px 0;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 2px;
      box-shadow: 0 2px 8px #ff005030;
      transition: background 0.16s, box-shadow 0.16s, transform 0.12s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }
    .gallery-download:hover {
      background: #e60047;
      animation: bounce 0.32s;
    }
    @media (max-width: 480px) {
      .container { max-width: 98vw; margin: 10px auto; padding: 16px 4vw 16px 4vw; }
      .logo-img { width: 33px; height: 33px;}
      h2 { font-size: 1.19em; }
      .info-table { font-size: 0.92em; }
      .preview img.cover { width: 96vw; max-width: 180px; }
      .gallery-item { min-width: 115px; max-width: 130px; padding: 6px 4px 8px 4px;}
      .gallery-img { max-width: 110px;}
    }
    .footer {
      margin-top: 40px;
      background: #16171c;
      color: #ccc;
      text-align: center;
      padding: 18px 5vw 24px 5vw;
      font-size: 0.96em;
      border-top: 1px solid #222;
      flex-shrink: 0;

    }
    .sosmed {
      margin: 10px 0 0 0;
    }
    .sosmed a {
      display: inline-block;
      margin: 0 8px;

      font-size: 1.33em;
      transition: color 0.18s;

    .sosmed a:hover {

    }
    .contact {

      color: #f2f2f2;
    }
    .contact a {
      color: #ff0050;
      text-decoration: none;

    }
    .contact a:hover {
      text-decoration: underline;
      color: #fff;
    }
    .copyright {
      margin-top: 13px;
      font-size: 0.9em;
      color: #888;
    }
    /* SVG animation */
    .download-svg {
      width: 18px;
      height: 18px;
      vertical-align: middle;
      margin-right: 2px;
      animation: dlwave 1.4s infinite linear;
    }
    @keyframes dlwave {
      0% { transform: translateY(0);}
      7% { transform: translateY(3px);}
      14% { transform: translateY(-2px);}
      20% { transform: translateY(6px);}
      24% { transform: translateY(-2px);}
      30% { transform: translateY(0);}
      100% { transform: translateY(0);}
    }
  </style>
</head>

  <script>
    function numFormat(num) {
      if (!num) return '0';
      return num.toLocaleString('id');
    }
    function formatDuration(sec) {
      if (!sec) return "0:00";
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${s.toString().padStart(2,"0")}`;
    }
    function formatDate(ts) {
      if (!ts) return "-";
      const d = new Date(ts * 1000);
      return d.toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric', hour: "2-digit", minute: "2-digit" });
    }

    // Hide clearBtn at start
    document.addEventListener("DOMContentLoaded", function() {
      document.getElementById("clearBtn").style.display = "none";
    });

    async function getVideo() {
      const url = document.getElementById("tiktokUrl").value.trim();
      const loading = document.getElementById("loading");
      const result = document.getElementById("result");
      const error = document.getElementById("error");
      const gallerySection = document.getElementById("gallerySection");
      const galleryScroll = document.getElementById("galleryScroll");
      const dlLinks = document.getElementById("dlLinks");
      if (!url) {
        error.textContent = "Masukkan URL TikTok dulu!";
        error.style.display = "block";
        loading.style.display = "none";
        return;
      }
      loading.textContent = "Memproses...";
      loading.style.display = "block";
      result.style.display = "none";
      error.style.display = "none";
      gallerySection.style.display = "none";
      galleryScroll.innerHTML = "";
      dlLinks.style.display = "flex";
      const api = `https://www.ditss.biz.id/api/download/tiktok-v2?url=${encodeURIComponent(url)}`;
      try {
        const res = await fetch(api);
        const json = await res.json();
        loading.style.display = "none";
        if (!json.status || !json.result?.data) {
          error.textContent = "Gagal ambil data! Cek URL TikTok atau coba lagi.";
          error.style.display = "block";
          return;
        }
        const data = json.result.data;
        document.getElementById("cover").src = data.cover;
        document.getElementById("cover").alt = data.id;
        document.getElementById("avatar").src = data.author?.avatar || "";
        document.getElementById("title").textContent = data.title || "Tanpa Judul";
        document.getElementById("author").textContent = data.author?.nickname || "-";
        document.getElementById("username").textContent = data.author?.unique_id || "-";
        document.getElementById("uploadDate").textContent = formatDate(data.create_time);
        document.getElementById("duration").textContent = formatDuration(data.duration);
        document.getElementById("like").textContent = numFormat(data.digg_count);
        document.getElementById("comment").textContent = numFormat(data.comment_count);
        document.getElementById("share").textContent = numFormat(data.share_count);
        document.getElementById("play").textContent = numFormat(data.play_count);

        document.getElementById("downloadNoWm").dataset.url = data.play;
        document.getElementById("downloadHd").dataset.url = data.hdplay;
        document.getElementById("downloadMp3").dataset.url = data.music_info?.play || "";

        // Gallery image
        if (Array.isArray(data.images) && data.images.length > 0) {
          gallerySection.style.display = "block";
          galleryScroll.innerHTML = "";
          data.images.forEach((imgUrl, i) => {
            const item = document.createElement("div");
            item.className = "gallery-item";
            const img = document.createElement("img");
            img.className = "gallery-img";
            img.src = imgUrl;
            img.alt = "TikTok Image #" + (i + 1);
            // Download button
            const btn = document.createElement("button");
            btn.className = "gallery-download";
            btn.innerHTML = `<svg class="download-svg" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-6-6m6 6l6-6" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="17" width="18" height="4" rx="2" fill="#fff" opacity=".15"/></svg>Download`;
            btn.onclick = () => downloadImage(imgUrl, `${data.id}-img${i+1}.jpg`);
            item.appendChild(img);
            item.appendChild(btn);
            galleryScroll.appendChild(item);
          });
          // Hide video/audio download links if only image content (optional, uncomment if needed)
          // dlLinks.style.display = "none";
        } else {
          gallerySection.style.display = "none";
        }

        result.style.display = "block";
        document.getElementById("clearBtn").style.display = "block";
      } catch (err) {
        loading.style.display = "none";
        error.textContent = "Error: " + err.message;
        error.style.display = "block";
      }
    }

    // Download video/audio sebagai file
    async function downloadVideo(type) {
      let url = '';
      let fileName = 'tiktok-video.mp4';
      const cover = document.getElementById("cover");
      const tiktokId = cover ? cover.alt : "tiktok-video";
      if (type === 'noWm') {
        url = document.getElementById('downloadNoWm').dataset.url;
        fileName = tiktokId + '-video.mp4';
      } else if (type === 'hd') {
        url = document.getElementById('downloadHd').dataset.url;
        fileName = tiktokId + '-hd.mp4';
      } else if (type === 'mp3') {
        url = document.getElementById('downloadMp3').dataset.url;
        fileName = tiktokId + '-audio.mp3';
      }
      if (!url) {
        alert('Link tidak ditemukan!');
        return;
      }
      try {
        document.getElementById("loading").textContent = "Mengunduh...";
        document.getElementById("loading").style.display = "block";
        const res = await fetch(url);
        const blob = await res.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          URL.revokeObjectURL(a.href);
          document.body.removeChild(a);
          document.getElementById("loading").style.display = "none";
        }, 1200);
      } catch (err) {
        document.getElementById("loading").style.display = "none";
        alert('Gagal download: ' + err.message);
      }
    }

        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          URL.revokeObjectURL(a.href);
